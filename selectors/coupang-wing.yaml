metadata:
  name: "쿠팡 WING"
  updated: "2024-03-02"
  version: "1.0"
  description: "쿠팡 판매자센터(WING) 셀렉터"

urls:
  login: "https://wing.coupang.com/login"
  order_list: "https://wing.coupang.com/order/management"
  claim_list: "https://wing.coupang.com/claim/management"
  vat_data: "https://wing.coupang.com/settlement/tax"

selectors:
  login:
    id_input:
      selector: 'input[name="username"]'
      type: "css"
    pw_input:
      selector: 'input[name="password"]'
      type: "css"
    login_btn:
      selector: 'button[type="submit"]'
      type: "css"

  order_management:
    direct_delivery:
      tab:
        selector: '[data-test="direct-delivery-tab"]'
        type: "css"
      order_list:
        selector: '.order-table tbody tr'
        type: "css"
      checkbox:
        selector: 'input[type="checkbox"]'
        type: "css"
      carrier_select:
        selector: 'select.carrier'
        type: "css"
      tracking_input:
        selector: 'input.tracking-number'
        type: "css"
      process_btn:
        selector: 'button.btn-ship'
        type: "css"

    delay:
      tab:
        selector: '[data-test="delay-tab"]'
        type: "css"
      order_list:
        selector: '.delay-table tbody tr'
        type: "css"
      reason_select:
        selector: 'select.delay-reason'
        type: "css"
      process_btn:
        selector: 'button.btn-delay'
        type: "css"

  claim_management:
    return:
      tab:
        selector: '[data-test="return-tab"]'
        type: "css"
      pending_list:
        selector: '.return-table tbody tr'
        type: "css"
      checkbox:
        selector: 'input[type="checkbox"]'
        type: "css"
      approve_btn:
        selector: 'button.btn-approve'
        type: "css"
      reject_btn:
        selector: 'button.btn-reject'
        type: "css"

    exchange:
      tab:
        selector: '[data-test="exchange-tab"]'
        type: "css"
      pending_list:
        selector: '.exchange-table tbody tr'
        type: "css"
      reject_btn:
        selector: 'button.btn-reject'
        type: "css"

  monthly:
    vat:
      year_select:
        selector: 'select[name="year"]'
        type: "css"
      month_select:
        selector: 'select[name="month"]'
        type: "css"
      download_btn:
        selector: 'button.btn-download'
        type: "css"

  common:
    loading:
      selector: '.loading-overlay'
      type: "css"
    modal:
      selector: '.modal'
      type: "css"
    confirm_btn:
      selector: 'button.confirm'
      type: "css"
